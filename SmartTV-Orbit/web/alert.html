<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartTV Orbit | TV Message</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at center, #1e1438, #0a0714);
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      text-align: center;
      padding: 40px;
    }
    .card {
      background: rgba(26, 18, 48, 0.85);
      border: 2px solid rgba(168, 85, 247, 0.4);
      border-radius: 36px;
      padding: 48px 64px;
      max-width: 900px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(168, 85, 247, 0.3);
      backdrop-filter: blur(20px);
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #7c3aed;
      color: white;
      font-size: 20px;
      font-weight: 700;
      padding: 8px 24px;
      border-radius: 9999px;
      margin-bottom: 28px;
      box-shadow: 0 4px 15px rgba(124, 58, 237, 0.5);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .message {
      font-size: 52px;
      font-weight: 800;
      line-height: 1.35;
      color: #ffffff;
      margin-bottom: 30px;
      word-break: break-word;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .countdown-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 24px;
    }
    .countdown-fill {
      height: 100%;
      width: 100%;
      background: #a855f7;
      border-radius: 3px;
      transition: width 1s linear;
    }
    .dismiss-hint {
      margin-top: 16px;
      font-size: 16px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">
      <span>🔔</span> Message from Family
    </div>
    <div class="message" id="msg-text">
      Message from Dev
    </div>
    <div class="countdown-bar">
      <div class="countdown-fill" id="bar"></div>
    </div>
    <div class="dismiss-hint">
      Auto-dismissing in <b id="timer" class="text-white">10</b>s (or press Back on remote)
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const rawMsg = params.get('msg') || 'Hello! Check your phone.';
    document.getElementById('msg-text').textContent = decodeURIComponent(rawMsg);

    let totalSeconds = 10;
    let remaining = totalSeconds;
    const bar = document.getElementById('bar');
    const timer = document.getElementById('timer');

    const interval = setInterval(() => {
      remaining--;
      timer.textContent = remaining;
      bar.style.width = ((remaining / totalSeconds) * 100) + '%';

      if (remaining <= 0) {
        clearInterval(interval);
        window.history.back();
      }
    }, 1000);
  </script>
</body>
</html>
